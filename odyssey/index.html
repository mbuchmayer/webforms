<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Merchant Application</title>
<link rel="stylesheet" href="odyssey-tokens.css">
<link rel="stylesheet" href="portal.css">
<link rel="stylesheet" href="widget-theme.css">
</head>
<body>
<div class="app">
<aside class="sidebar">
    <div class="side-logo">
        <!-- NMI logo from the Odyssey product UI kit -->
        <svg viewBox="0 0 166 56" aria-label="NMI">
            <defs>
                <linearGradient id="nmiSideGrad" x1="0" x2="0" y1="0" y2="1">
                    <stop offset="0%" stop-color="#D2FF97"/>
                    <stop offset="50%" stop-color="#85F39B"/>
                    <stop offset="100%" stop-color="#5CD5A5"/>
                </linearGradient>
            </defs>
            <rect x="6" y="9" width="8" height="38" rx="1.5" fill="url(#nmiSideGrad)"/>
            <rect x="44" y="9" width="8" height="38" rx="1.5" fill="url(#nmiSideGrad)"/>
            <path d="M 45.5 9.2 L 53 16.5 L 14 47 L 6.5 39.7 Z" fill="url(#nmiSideGrad)"/>
            <circle cx="56.5" cy="13" r="5" fill="#5CDDAD"/>
            <text x="74" y="40" font-family="Public Sans, system-ui, sans-serif" font-size="32" font-weight="900" fill="currentColor">NMI</text>
        </svg>
    </div>
    <nav class="side-nav">
        <a class="side-link" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12L12 4L21 12"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>Dashboard</a>
        <a class="side-link active" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l1.5-5h13L20 10"/><path d="M4 10h16v10H4z"/><path d="M10 20v-5h4v5"/></svg>Merchants</a>
        <a class="side-link" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="13" rx="2"/><line x1="2.5" y1="10" x2="21.5" y2="10"/></svg>Residuals</a>
        <a class="side-link" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>Reports</a>
        <a class="side-link" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Settings</a>
    </nav>
</aside>

<div class="main">
<header class="topbar">
    <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="search" placeholder="Search merchants by name or MID" aria-label="Search merchants">
    </label>
    <span class="avatar" title="Jordan Lee">JL</span>
</header>

<main class="page">
    <ol class="breadcrumb" aria-label="Breadcrumb">
        <li><a href="#">Merchants</a></li>
        <li><span aria-current="page">New merchant application</span></li>
    </ol>
    <h1 class="page-title">New Merchant Application</h1>
    <p class="page-subtitle">Complete the application to start underwriting. Your progress is saved as you go.</p>

    <div id="app-banner" class="banner" role="status"></div>

    <section class="card">
        <!-- Merchant Central JS Widget. The loader must sit inside <body>: it inserts the bundle before the first <script> in the body. -->
        <script>
            (async function (w,d,s,o,f,cf,js,fjs) {
                w['WF-Widget'] = o; cf = { org: new URL(f).origin, ...cf };
                w[o] = w[o] || function () { (w[o].q = w[o].q || []).push([...arguments, cf]) };
                const el = !d.getElementById('wf-widget') && Object.assign(document.createElement('div'), { id: 'wf-widget' });
                el && d.currentScript.parentNode.insertBefore(el, d.currentScript)
                js = d.createElement(s), fjs = d.body.getElementsByTagName(s)[0]; const fc = await fetch(f).then(r => r.json());
                cf.bnd = fc?.url; js.id = o; js.src = fc?.url; js.async = 1; fjs.parentNode.insertBefore(js, fjs);
            }(window, document, 'script', 'wf', 'https://demo.iriscrm.com/web-form/bundle', { lf: false }));

            // Portal reactions to the widget's lifecycle, on top of the default console logging.
            function showBanner(kind, text) {
                const b = document.getElementById('app-banner');
                b.className = 'banner show ' + kind;
                b.textContent = text;
                b.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            wf('init', {
                elementId: "wf-widget",
                id: 'e87a6b86-fca6-4016-9ca2-0ded48e3c5a6',
                options: {},
                events: {
                    onLoaded: ({ initialValues }) => { console.log('onLoaded', { initialValues }) },
                    beforeSubmit: async (values, { form }) => { console.log('beforeSubmit', { values, form }) },
                    onSubmitted: (values, { form }) => { console.log('onSubmitted', { values, form }) },
                    onSubmitFailed: (msg, { values, form }) => {
                        console.log('onSubmitFailed', { msg, values, form });
                        showBanner('error', 'The application could not be submitted: ' + msg);
                    },
                    onESignFailed: (msg, { eSignType }) => {
                        console.log('onESignFailed', { msg, eSignType });
                        showBanner('error', 'Signing did not complete. Please try again.');
                    },
                    onFormFinished: (values, { form, hasESign }) => {
                        console.log('onFormFinished', { values, form, hasESign });
                        showBanner('success', hasESign ? 'Application submitted and signed.' : 'Application submitted.');
                    }
                }
            });
        </script>
    </section>
</main>
</div>
</div>

<script src="inspect.js"></script>
</body>
</html>
